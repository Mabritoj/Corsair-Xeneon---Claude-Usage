<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>tr('Claude Usage')</title>
		<link rel="icon" type="image/svg+xml" href="resources/icon.svg">
		<link rel="stylesheet" href="styles/style.css">

		<!-- User-configurable properties (become global JS variables in the widget) -->
		<meta
			name="x-icue-property"
			content="bridgePort"
			data-label="tr('Bridge Port')"
			data-type="textfield"
			data-default="'37650'"
		>
		<meta
			name="x-icue-property"
			content="pollSeconds"
			data-label="tr('Poll Interval (seconds)')"
			data-type="textfield"
			data-default="'60'"
		>
		<meta
			name="x-icue-property"
			content="maxModels"
			data-label="tr('Max Model Rows')"
			data-type="textfield"
			data-default="'3'"
		>
		<meta
			name="x-icue-property"
			content="accentColor"
			data-label="tr('Accent Color')"
			data-type="color"
			data-default="'#D97757'"
		>
		<meta
			name="x-icue-property"
			content="textColor"
			data-label="tr('Text Color')"
			data-type="color"
			data-default="'#F5F4F2'"
		>
		<meta
			name="x-icue-property"
			content="backgroundColor"
			data-label="tr('Background Color')"
			data-type="color"
			data-default="'#1B1A19'"
		>

		<script type="application/json" id="x-icue-groups">
			[
				{ "title": "tr('Connection')", "properties": ["bridgePort", "pollSeconds"], "info": "tr('Port of the local Claude Usage Bridge (default 37650).')" },
				{ "title": "tr('Display')", "properties": ["maxModels"], "info": "tr('Maximum number of per-model weekly rows to show (default 3).')" },
				{ "title": "tr('Appearance')", "properties": ["accentColor", "textColor", "backgroundColor"] }
			]
		</script>
	</head>
	<body>
		<div id="widget" class="widget">
			<header class="head">
				<div class="brand">
					<span class="logo" aria-hidden="true"></span>
					<span class="brand-name">Claude Usage</span>
				</div>
				<span id="status-dot" class="status-dot" title=""></span>
			</header>

			<main id="rows" class="rows">
				<!-- rows injected by widget.js -->
			</main>

			<footer id="footer" class="foot">
				<span id="updated" class="updated"></span>
			</footer>

			<div id="message" class="message hidden"></div>
		</div>

		<script>
			// iCUE lifecycle hooks. iCUE reads window.icueEvents when its API is
			// ready and on every property change. Logic lives in widget.js.
			window.icueEvents = {
				onICUEInitialized: function () {
					if (window.ClaudeUsageWidget) window.ClaudeUsageWidget.start();
				},
				onDataUpdated: function () {
					if (window.ClaudeUsageWidget) window.ClaudeUsageWidget.onDataUpdated();
				},
			};
		</script>
		<script src="scripts/widget.js"></script>
	</body>
</html>
